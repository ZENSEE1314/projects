<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bridge X">
  <defs>
    <linearGradient id="bx" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35E0C8"/>
      <stop offset="1" stop-color="#9B8CFF"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0B0E13" stroke="#232A36" stroke-width="1.5"/>
  <!-- suspension cable draped over the X -->
  <path d="M14 22 Q32 6 50 22" fill="none" stroke="url(#bx)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <g stroke="url(#bx)" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <line x1="23" y1="14.6" x2="23" y2="23"/>
    <line x1="32" y1="12" x2="32" y2="23"/>
    <line x1="41" y1="14.6" x2="41" y2="23"/>
  </g>
  <!-- the X: two bridge spans crossing -->
  <g stroke="url(#bx)" stroke-width="6.5" stroke-linecap="round">
    <line x1="19" y1="21" x2="45" y2="47"/>
    <line x1="45" y1="21" x2="19" y2="47"/>
  </g>
  <!-- centre node -->
  <circle cx="32" cy="34" r="3.4" fill="#0B0E13" stroke="url(#bx)" stroke-width="2.2"/>
</svg>
